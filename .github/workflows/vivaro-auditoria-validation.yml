name: VIVARO Auditoria - Validacao
on:
  push:
    branches: [feat/vivaro-auditoria]
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workspace/package-lock.json
      - run: npm ci
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: deja_platform_test
          MYSQL_USER: deja_test
          MYSQL_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: deja_platform_test
      DB_USER: deja_test
      DB_PASSWORD: test-password
      JWT_SECRET_KEY: github-ci-only-test-key-not-for-production
    defaults:
      run:
        working-directory: deja-platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests/fotos/media/test_audit_api.py
      - run: python -m pytest -q tests/fotos/media/test_audit_api.py
