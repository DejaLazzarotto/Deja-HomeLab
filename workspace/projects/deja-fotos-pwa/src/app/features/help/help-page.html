<main class="help-page">
  <header class="help-header">
    <div class="help-brand">
      <img
        src="/branding/vivaro/icon-144.png"
        alt=""
        width="40"
        height="40"
      />
      <span>VIVARO</span>
    </div>

    <h1>Central de Ajuda</h1>
    <p>Aprenda como usar o aplicativo</p>
  </header>

  <section class="help-topics" aria-label="Assuntos de ajuda">
    @for (topic of topics; track topic.id) {
      <button
        type="button"
        class="help-topic"
        (click)="openTopic(topic)"
      >
        <span
          class="help-topic__illustration"
          [attr.data-topic]="topic.icon"
          aria-hidden="true"
        >
          @switch (topic.icon) {
            @case ('calendar') {
              <svg viewBox="0 0 64 64">
                <rect x="9" y="13" width="46" height="41" rx="7" fill="#fff" stroke="#397da9" stroke-width="3"/>
                <path d="M9 25h46" stroke="#397da9" stroke-width="3"/>
                <path d="M21 8v11M43 8v11" stroke="#397da9" stroke-width="4" stroke-linecap="round"/>
                <rect x="19" y="32" width="9" height="8" rx="2" fill="#8ac0e4"/>
                <rect x="34" y="32" width="9" height="8" rx="2" fill="#8ac0e4"/>
                <rect x="19" y="44" width="9" height="6" rx="2" fill="#bfdced"/>
              </svg>
            }
            @case ('people') {
              <svg viewBox="0 0 64 64">
                <circle cx="23" cy="23" r="11" fill="#f1bd8d"/>
                <path d="M12 20c0-13 21-17 23 1-9-5-16-3-23-1" fill="#40586e"/>
                <circle cx="44" cy="25" r="10" fill="#d9a17c"/>
                <path d="M34 24c0-13 20-14 20 0-7-6-13-4-20 0" fill="#665044"/>
                <path d="M5 56c1-14 10-21 20-21s18 7 20 21" fill="#78b3d7"/>
                <path d="M31 56c1-11 7-18 15-18s14 7 15 18" fill="#95cdbb"/>
                <path d="M3 56h58" stroke="#fff" stroke-width="2"/>
              </svg>
            }
            @case ('albums') {
              <svg viewBox="0 0 64 64">
                <rect x="11" y="7" width="40" height="48" rx="5" fill="#d6b9ee"/>
                <rect x="16" y="11" width="40" height="48" rx="5" fill="#568fb9"/>
                <rect x="23" y="20" width="27" height="26" rx="3" fill="#fff"/>
                <circle cx="43" cy="27" r="4" fill="#e9c75b"/>
                <path d="M26 42l9-11 7 8 5-5 3 8" fill="#77b99c"/>
                <path d="M26 42h24" stroke="#77b99c" stroke-width="2"/>
              </svg>
            }
            @case ('quick') {
              <svg viewBox="0 0 64 64">
                <rect x="3" y="14" width="19" height="35" rx="6" fill="#e88d9e"/>
                <path d="M12.5 36l-6-6a4 4 0 0 1 6-6 4 4 0 0 1 6 6z" fill="#fff"/>
                <rect x="23" y="9" width="19" height="40" rx="6" fill="#79b4dc"/>
                <circle cx="32.5" cy="28" r="7" fill="none" stroke="#fff" stroke-width="2.5"/>
                <path d="M32.5 23v5l3 2" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
                <rect x="43" y="14" width="19" height="35" rx="6" fill="#aa91d2"/>
                <path d="m50 23 8 7-8 7z" fill="#fff"/>
              </svg>
            }
            @case ('viewer') {
              <svg viewBox="0 0 64 64">
                <rect x="17" y="3" width="31" height="57" rx="7" fill="#253f5d"/>
                <rect x="20" y="9" width="25" height="44" rx="2" fill="#d9eff8"/>
                <circle cx="39" cy="21" r="5" fill="#f1ca65"/>
                <path d="M20 44l10-15 7 8 8-11v27H20z" fill="#8fbda5"/>
                <path d="M6 31l-5 5 5 5M57 31l6 5-6 5" fill="none" stroke="#397da9" stroke-width="3" stroke-linecap="round"/>
                <circle cx="32" cy="56" r="2" fill="#fff"/>
              </svg>
            }
          }
        </span>

        <span class="help-topic__copy">
          <strong>{{ topic.title }}</strong>
          <span>{{ topic.description }}</span>
        </span>

        <span class="help-topic__arrow" aria-hidden="true">
          ›
        </span>
      </button>
    }
  </section>

  <footer class="help-footer">
    <button type="button" (click)="goBack()">
      Voltar para o VIVARO
    </button>
  </footer>
</main>
