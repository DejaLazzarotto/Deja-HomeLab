<main class="explore-page">
  <section class="explore-hero">
    <div class="brand-row">
      <div
        class="brand-logo"
        aria-hidden="true"
      >
        <svg viewBox="0 0 96 72">
          <path
            class="camera-outline"
            d="
              M18 22
              H31
              L36 14
              H60
              L65 22
              H78
              C84 22 88 26 88 32
              V57
              C88 63 84 67 78 67
              H18
              C12 67 8 63 8 57
              V32
              C8 26 12 22 18 22
              Z
            "
          />

          <circle
            class="camera-dot"
            cx="75"
            cy="33"
            r="3"
          />

          <path
            class="camera-heart"
            d="
              M48 58
              C40 50 29 43 29 34
              C29 28 33 24 39 24
              C43 24 46 26 48 30
              C50 26 53 24 57 24
              C63 24 67 28 67 34
              C67 43 56 50 48 58
              Z
            "
          />
        </svg>
      </div>

      <span class="brand-name">
        Fotos
      </span>
    </div>

    <h1>
      Como deseja explorar?
    </h1>

    <p>
      Escolha uma forma de navegar
      pelo seu acervo.
    </p>
  </section>

  <section class="explore-options">
    <button
      class="explore-card"
      type="button"
      (click)="openDates()"
    >
      <div class="card-heading">
        <div class="card-icon">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect
              x="4"
              y="5"
              width="16"
              height="15"
              rx="2"
            />

            <path d="M8 3v4M16 3v4M4 9h16" />
            <path d="M8 13h2M12 13h2M16 13h1M8 17h2M12 17h2" />
          </svg>
        </div>

        <div class="card-copy">
          <h2>
            Por datas
          </h2>

          <p>
            Reviva momentos por ano,
            mês ou período.
          </p>
        </div>

        <span class="card-arrow">
          ›
        </span>
      </div>

      <div class="date-tags">
        <span>2026</span>
        <span>2025</span>
        <span>Janeiro</span>
        <span>Férias</span>
        <span>Aniversários</span>
      </div>

      <div class="preview-grid">
        <div class="preview preview-one"></div>
        <div class="preview preview-two"></div>
        <div class="preview preview-three"></div>
      </div>
    </button>

    <button
      class="explore-card"
      type="button"
      (click)="openPeople()"
    >
      <div class="card-heading">
        <div class="card-icon">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              cx="9"
              cy="8"
              r="3"
            />

            <circle
              cx="16"
              cy="9"
              r="2.5"
            />

            <path d="M3 19c0-4 2.5-6 6-6s6 2 6 6" />
            <path d="M14 14c3.5 0 6 1.5 6 5" />
          </svg>
        </div>

        <div class="card-copy">
          <h2>
            Por pessoas
          </h2>

          <p>
            Encontre fotos pelas
            pessoas presentes.
          </p>
        </div>

        <span class="card-arrow">
          ›
        </span>
      </div>

      <div class="people-preview">
        <div class="person-item">
          <div class="person-avatar">
            J
          </div>

          <span>
            Juliana
          </span>
        </div>

        <div class="person-item">
          <div class="person-avatar">
            J
          </div>

          <span>
            João
          </span>
        </div>

        <div class="person-item">
          <div class="person-avatar">
            A
          </div>

          <span>
            Ana
          </span>
        </div>

        <div class="person-item">
          <div class="person-avatar">
            F
          </div>

          <span>
            Família
          </span>
        </div>
      </div>
    </button>
  </section>

  <section class="quick-section">
    <h2>
      Explorar rápido
    </h2>

    <div class="quick-grid">
      <button
        class="quick-card"
        type="button"
      >
        <span class="quick-icon">
          ♥
        </span>

        <span>
          Favoritos
        </span>
      </button>

      <button
        class="quick-card"
        type="button"
      >
        <span class="quick-icon">
          ◷
        </span>

        <span>
          Recentes
        </span>
      </button>

      <button
        class="quick-card"
        type="button"
      >
        <span class="quick-icon">
          ▶
        </span>

        <span>
          Vídeos
        </span>
      </button>
    </div>
  </section>
</main>
