
<main class="explore-page">
  <div class="profile-container">
    <button
      class="header-action-button"
      type="button"
      (click)="openWelcome()"
      aria-label="Abrir boas-vindas do VIVARO"
      title="Boas-vindas"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 7v14" />
        <path d="M3 18V5a2 2 0 0 1 2-2h3a4 4 0 0 1 4 4 4 4 0 0 1 4-4h3a2 2 0 0 1 2 2v13h-5a4 4 0 0 0-4 3 4 4 0 0 0-4-3H3Z" />
      </svg>
    </button>

    <button
      class="header-action-button"
      type="button"
      (click)="openHelp()"
      aria-label="Abrir Central de Ajuda"
      title="Central de Ajuda"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4" />
        <path d="M12 17h.01" />
      </svg>
    </button>
    <button
      class="profile-avatar-button"
      type="button"
      (click)="toggleProfileMenu()"
      [attr.aria-expanded]="profileMenuOpen()"
      aria-label="Abrir menu do usuário"
      aria-haspopup="true"
    >
      <span class="profile-avatar">
        {{ userInitial }}
      </span>
    </button>

    @if (profileMenuOpen()) {
      <div class="profile-menu">
        <div class="profile-menu-header">
          <strong>
            {{ currentUser()?.name || 'Usuário' }}
          </strong>

          <span>
            {{ currentUser()?.email }}
          </span>
        </div>

        <button
          class="profile-menu-logout"
          type="button"
          (click)="logout()"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M9 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"
            />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>

          Sair
        </button>
      </div>
    }
  </div>

  <section class="explore-hero">
    <div class="brand-row">
      <div class="brand-logo" aria-hidden="true">
        <img
          src="/branding/vivaro/icon-144.png"
          alt=""
          width="96"
          height="96"
        />
      </div>

      <span class="brand-name">
        VIVARO
      </span>
    </div>

    <h1>
      Como deseja explorar?
    </h1>

    <p>
      Escolha uma forma de navegar
      pelo seu acervo.
    </p>
  </section>

  <section class="explore-options">
    <button
      class="explore-card"
      type="button"
      (click)="openDates()"
    >
      <div class="card-heading">
        <div class="card-icon">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect
              x="4"
              y="5"
              width="16"
              height="15"
              rx="2"
            />

            <path d="M8 3v4M16 3v4M4 9h16" />
            <path d="M8 13h2M12 13h2M16 13h1M8 17h2M12 17h2" />
          </svg>
        </div>

        <div class="card-copy">
          <h2>
            Por datas
          </h2>

          <p>
            Reviva momentos por ano,
            mês ou período.
          </p>
        </div>

        <span class="card-arrow">
          ›
        </span>
      </div>
    </button>

    <article class="explore-card people-card">
      <button
        class="people-card-heading"
        type="button"
        (click)="openPeople()"
      >
        <div class="card-heading">
          <div class="card-icon">
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle
                cx="9"
                cy="8"
                r="3"
              />

              <circle
                cx="16"
                cy="9"
                r="2.5"
              />

              <path d="M3 19c0-4 2.5-6 6-6s6 2 6 6" />
              <path d="M14 14c3.5 0 6 1.5 6 5" />
            </svg>
          </div>

          <div class="card-copy">
            <h2>
              Por pessoas
            </h2>

            <p>
              Encontre fotos pelas
              pessoas presentes.
            </p>
          </div>

          <span class="card-arrow">
            ›
          </span>
        </div>
      </button>

      <div class="people-preview">
        @for (person of peoplePreview(); track person.id) {
          <button
            class="person-item"
            type="button"
            (click)="openPerson(person.id)"
            [attr.aria-label]="'Abrir fotos de ' + person.name"
          >
            @if (person.avatarUrl) {
              <img
                class="person-avatar person-avatar-image"
                [src]="person.avatarUrl"
                [alt]="person.name"
              />
            } @else {
              <div
                class="person-avatar"
                aria-hidden="true"
              >
                {{ person.name.charAt(0).toUpperCase() }}
              </div>
            }

            <span>
              {{ person.name }}
            </span>
          </button>
        }
      </div>
    </article>

    <button
      class="explore-card"
      type="button"
      (click)="openAlbums()"
    >
      <div class="card-heading">
        <div class="card-icon">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect x="4" y="5" width="14" height="15" rx="2" />
            <path d="M8 5V3h12v14h-2" />
            <path d="m7 16 3-3 3 3 2-2 3 3" />
          </svg>
        </div>

        <div class="card-copy">
          <h2>
            Álbuns
          </h2>

          <p>
            Explore seus álbuns e
            coleções especiais.
          </p>
        </div>

        <span class="card-arrow">
          ›
        </span>
      </div>
    </button>
  </section>

  <section class="quick-section">
    <h2>
      Explorar rápido
    </h2>

    <div class="quick-grid">
      <button
        class="quick-card"
        type="button"
      (click)="openFavorites()"
      >
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
          </svg>
        </span>

        <span>
          Favoritos
        </span>
      </button>

      <button
        class="quick-card"
        type="button"
        (click)="openRecents()"
      >
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3.5 2"/>
          </svg>
        </span>

        <span>
          Recentes
        </span>
      </button>

      <button
        class="quick-card"
        type="button"
        (click)="openVideos()"
      >
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3"/>
            <path d="m10 8 6 4-6 4Z"/>
          </svg>
        </span>

        <span>
          Vídeos
        </span>
      </button>
    </div>
  </section>
</main>
