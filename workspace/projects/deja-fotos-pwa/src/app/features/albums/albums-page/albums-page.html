<main class="albums-page">
  <header class="albums-header">
    <button
      class="back-button"
      type="button"
      aria-label="Voltar para Explorar"
      (click)="goBack()"
    >
      ‹
    </button>

    <div>
      <p class="eyebrow">
        Fotos
      </p>

      <h1>
        Meus álbuns
      </h1>
    </div>
  </header>

  @if (loading()) {
    <section class="state-card">
      <p>
        Carregando álbuns...
      </p>
    </section>
  } @else if (error()) {
    <section class="state-card state-card-error">
      <p>
        {{ error() }}
      </p>
    </section>
  } @else if (albums().length === 0) {
    <section class="state-card">
      <p>
        Nenhum álbum disponível.
      </p>
    </section>
  } @else {
    <section class="albums-grid">
      @for (
        album of albums();
        track album.id
      ) {
        <button
          class="album-card"
          type="button"
          (click)="openAlbum(album.id)"
          [attr.aria-label]="'Abrir álbum ' + album.name"
        >
          <div class="album-cover">
            @if (album.coverUrl) {
              <img
                class="album-cover-image"
                [src]="album.coverUrl"
                [alt]="'Capa do álbum ' + album.name"
                loading="lazy"
              />
            } @else {
              <span class="album-cover-placeholder">
                {{ album.name.charAt(0).toUpperCase() }}
              </span>
            }
          </div>

          <div class="album-info">
            <h2>
              {{ album.name }}
            </h2>

            @if (album.description) {
              <p class="album-description">
                {{ album.description }}
              </p>
            }
          </div>
        </button>
      }
    </section>
  }
</main>
