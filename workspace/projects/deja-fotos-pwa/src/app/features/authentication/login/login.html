<main class="login-page">
  <section class="login-shell">
    <div class="login-background"></div>

    <div class="login-content">
      <header class="login-header">
        <div
          class="brand-logo"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 96 72"
            role="img"
          >
            <path
              class="camera-outline"
              d="
                M18 22
                H31
                L36 14
                H60
                L65 22
                H78
                C84 22 88 26 88 32
                V57
                C88 63 84 67 78 67
                H18
                C12 67 8 63 8 57
                V32
                C8 26 12 22 18 22
                Z
              "
            />

            <circle
              class="camera-dot"
              cx="75"
              cy="33"
              r="3"
            />

            <path
              class="camera-heart"
              d="
                M48 58
                C40 50 29 43 29 34
                C29 28 33 24 39 24
                C43 24 46 26 48 30
                C50 26 53 24 57 24
                C63 24 67 28 67 34
                C67 43 56 50 48 58
                Z
              "
            />
          </svg>
        </div>

        <h1>Fotos</h1>

        <p>
          Acesse seu álbum
        </p>
      </header>

      <form
        class="login-form"
        [formGroup]="form"
        (ngSubmit)="submit()"
        autocomplete="on"
      >
        <label class="field">
          <span class="field-icon">
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect
                x="5"
                y="3"
                width="14"
                height="18"
                rx="2"
              />
              <path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1" />
            </svg>
          </span>

          <input
            type="text"
            formControlName="organizationCode"
            name="organizationCode"
            autocomplete="off"
            placeholder="Organização"
            aria-label="Organização"
          />
        </label>

        <label class="field">
          <span class="field-icon">
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="2"
              />
              <path d="m4 7 8 6 8-6" />
            </svg>
          </span>

          <input
            type="email"
            formControlName="email"
            name="email"
            autocomplete="username"
            placeholder="E-mail"
            aria-label="E-mail"
          />
        </label>

        <label class="field">
          <span class="field-icon">
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect
                x="5"
                y="10"
                width="14"
                height="11"
                rx="2"
              />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>
          </span>

          <input
            type="password"
            formControlName="password"
            name="password"
            autocomplete="current-password"
            placeholder="Senha"
            aria-label="Senha"
          />

          <span
            class="field-action"
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
            >
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
              <circle
                cx="12"
                cy="12"
                r="3"
              />
            </svg>
          </span>
        </label>

        @if (error()) {
          <p
            class="login-error"
            role="alert"
          >
            {{ error() }}
          </p>
        }

        <button
          class="login-button"
          type="submit"
          [disabled]="
            form.invalid
            || loading()
          "
        >
          @if (loading()) {
            Entrando...
          } @else {
            Entrar
          }
        </button>
      </form>
    </div>
  </section>
</main>
