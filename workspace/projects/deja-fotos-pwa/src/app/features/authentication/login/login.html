
<main class="login-page">
  <section class="login-shell">
    <div class="login-background"></div>

    <div class="login-content">
      <header class="login-header">
        <div class="brand-logo" aria-hidden="true">
          <img
            src="branding/vivaro/icon-144.png"
            alt=""


          />
        </div>

        <h1>VIVARO</h1>

        <p>
          Acesse seu álbum
        </p>
      </header>

      <form
        class="login-form"
        [formGroup]="form"
        (ngSubmit)="submit()"
        autocomplete="on"
      >
        <label class="field">
          <span class="field-icon">
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect
                x="5"
                y="3"
                width="14"
                height="18"
                rx="2"
              />
              <path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1" />
            </svg>
          </span>

          <input
            type="text"
            formControlName="organizationCode"
            name="organizationCode"
            autocomplete="off"
            placeholder="Organização"
            aria-label="Organização"
          />
        </label>

        <label class="field">
          <span class="field-icon">
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="2"
              />
              <path d="m4 7 8 6 8-6" />
            </svg>
          </span>

          <input
            type="email"
            formControlName="email"
            name="email"
            autocomplete="username"
            placeholder="E-mail"
            aria-label="E-mail"
          />
        </label>

        <label class="field">
          <span class="field-icon">
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect
                x="5"
                y="10"
                width="14"
                height="11"
                rx="2"
              />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>
          </span>

          <input
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            name="password"
            autocomplete="current-password"
            placeholder="Senha"
            aria-label="Senha"
          />

          <button
            class="field-action"
            type="button"
            [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
            [attr.aria-pressed]="showPassword()"
            (click)="togglePasswordVisibility()"
          >
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
              <circle
                cx="12"
                cy="12"
                r="3"
              />
            </svg>
          </button>
        </label>

        @if (error()) {
          <p
            class="login-error"
            role="alert"
          >
            {{ error() }}
          </p>
        }

        <button
          class="login-button"
          type="submit"
          [disabled]="
            form.invalid
            || loading()
          "
        >
          @if (loading()) {
            Entrando...
          } @else {
            Entrar
          }
        </button>

        <a
          routerLink="/activation"
          style="
            display: block;
            margin-top: 4px;
            text-align: center;
            color: #236ea6;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
          "
        >
          Primeiro acesso? Crie sua senha
        </a>

        <a
          routerLink="/password-reset"
          style="
            display: block;
            margin-top: 10px;
            text-align: center;
            color: #236ea6;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
          "
        >
          Esqueci minha senha?
        </a>
      </form>
    </div>
  </section>
</main>
