<form
  class="portal-ticket-form"
  [formGroup]="form"
  (ngSubmit)="submit()"
>
  <div class="portal-ticket-form-field">
    <label for="portal-ticket-title">
      Título
    </label>

    <input
      id="portal-ticket-title"
      type="text"
      formControlName="title"
      maxlength="150"
      autocomplete="off"
    />

    @if (
      form.controls.title.touched
      && form.controls.title.invalid
    ) {
      <p class="portal-ticket-form-error">
        Informe um título para o chamado.
      </p>
    }
  </div>

  <div class="portal-ticket-form-field">
    <label for="portal-ticket-description">
      Descrição
    </label>

    <textarea
      id="portal-ticket-description"
      formControlName="description"
      maxlength="5000"
      rows="8"
    ></textarea>

    @if (
      form.controls.description.touched
      && form.controls.description.invalid
    ) {
      <p class="portal-ticket-form-error">
        Informe uma descrição para o chamado.
      </p>
    }
  </div>

  <div class="portal-ticket-form-actions">
    <button
      type="button"
      class="portal-ticket-form-secondary"
      (click)="cancel()"
    >
      Cancelar
    </button>

    <button
      type="submit"
      class="portal-ticket-form-primary"
    >
      Abrir chamado
    </button>
  </div>
</form>
