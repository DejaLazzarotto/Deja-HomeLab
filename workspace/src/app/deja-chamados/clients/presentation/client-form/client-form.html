<section class="client-form">
  <header class="client-form__header">
    <h3>{{ title() }}</h3>

    <p>Preencha os dados institucionais e de contato do cliente.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label class="client-form__field">
      <span>Ambiente</span>

      <select
        formControlName="environmentId"
        (blur)="onFieldBlur('environmentId')"
      >
        <option value="" disabled>Selecione o ambiente</option>

        @for (environment of environmentOptions(); track environment.id) {
          <option [value]="environment.id">
            {{ environment.name }}
          </option>
        }
      </select>

      @if (
        form.controls.environmentId.hasError('required') &&
        form.controls.environmentId.touched
      ) {
        <small class="client-form__error">Selecione o ambiente.</small>
      }
    </label>

    <label class="client-form__field">
      <span>Razão social</span>

      <input
        type="text"
        formControlName="companyName"
        maxlength="255"
        (blur)="onFieldBlur('companyName')"
      />

      @if (
        form.controls.companyName.hasError('required') &&
        form.controls.companyName.touched
      ) {
        <small class="client-form__error">Informe a razão social.</small>
      }
    </label>

    <label class="client-form__field">
      <span>Nome fantasia</span>

      <input
        type="text"
        formControlName="fantasyName"
        maxlength="255"
        (blur)="onFieldBlur('fantasyName')"
      />

      @if (
        form.controls.fantasyName.hasError('required') &&
        form.controls.fantasyName.touched
      ) {
        <small class="client-form__error">Informe o nome fantasia.</small>
      }
    </label>

    <label class="client-form__field">
      <span>CPF/CNPJ</span>

      <input
        type="text"
        formControlName="document"
        maxlength="18"
        inputmode="numeric"
        (input)="onDocumentInput()"
        (blur)="onFieldBlur('document')"
      />

      @if (
        form.controls.document.hasError('required') &&
        form.controls.document.touched
      ) {
        <small class="client-form__error">Informe o CPF ou CNPJ.</small>
      }

      @if (
        form.controls.document.hasError('invalidDocument') &&
        form.controls.document.touched
      ) {
        <small class="client-form__error">CPF ou CNPJ inválido.</small>
      }
    </label>

    <label class="client-form__field">
      <span>Contato principal</span>

      <input
        type="text"
        formControlName="contactName"
        maxlength="255"
        (blur)="onFieldBlur('contactName')"
      />

      @if (
        form.controls.contactName.hasError('required') &&
        form.controls.contactName.touched
      ) {
        <small class="client-form__error">Informe o contato principal.</small>
      }
    </label>

    <label class="client-form__field">
      <span>Telefone</span>

      <input
        type="tel"
        formControlName="phone"
        maxlength="15"
        inputmode="tel"
        (input)="onPhoneInput()"
        (blur)="onFieldBlur('phone')"
      />

      @if (
        form.controls.phone.hasError('required') &&
        form.controls.phone.touched
      ) {
        <small class="client-form__error">Informe o telefone.</small>
      }

      @if (
        form.controls.phone.hasError('invalidPhone') &&
        form.controls.phone.touched
      ) {
        <small class="client-form__error">Telefone inválido.</small>
      }
    </label>

    <label class="client-form__field">
      <span>WhatsApp</span>

      <input
        type="tel"
        formControlName="whatsapp"
        maxlength="15"
        inputmode="tel"
        (input)="onWhatsappInput()"
        (blur)="onFieldBlur('whatsapp')"
      />

      @if (
        form.controls.whatsapp.hasError('required') &&
        form.controls.whatsapp.touched
      ) {
        <small class="client-form__error">Informe o WhatsApp.</small>
      }

      @if (
        form.controls.whatsapp.hasError('invalidPhone') &&
        form.controls.whatsapp.touched
      ) {
        <small class="client-form__error">WhatsApp inválido.</small>
      }
    </label>

    <label class="client-form__field">
      <span>E-mail</span>

      <input
        type="email"
        formControlName="email"
        maxlength="255"
        (blur)="onFieldBlur('email')"
      />

      @if (
        form.controls.email.hasError('required') &&
        form.controls.email.touched
      ) {
        <small class="client-form__error">Informe o e-mail.</small>
      }

      @if (
        form.controls.email.hasError('invalidEmail') &&
        form.controls.email.touched
      ) {
        <small class="client-form__error">E-mail inválido.</small>
      }
    </label>

    <label class="client-form__field">
      <span>Cidade</span>

      <input
        type="text"
        formControlName="city"
        maxlength="100"
        (blur)="onFieldBlur('city')"
      />

      @if (
        form.controls.city.hasError('required') &&
        form.controls.city.touched
      ) {
        <small class="client-form__error">Informe a cidade.</small>
      }
    </label>

    <label class="client-form__field">
      <span>Estado</span>

      <input
        type="text"
        formControlName="state"
        maxlength="2"
        (input)="onStateInput()"
        (blur)="onFieldBlur('state')"
      />

      @if (
        form.controls.state.hasError('required') &&
        form.controls.state.touched
      ) {
        <small class="client-form__error">Informe o estado.</small>
      }

      @if (
        form.controls.state.hasError('minlength') &&
        form.controls.state.touched
      ) {
        <small class="client-form__error">Use a sigla com duas letras.</small>
      }
    </label>

    <label class="client-form__field client-form__full">
      <span>Observações</span>

      <textarea
        rows="3"
        maxlength="1000"
        formControlName="notes"
      ></textarea>

      <small class="client-form__hint">
        {{ form.controls.notes.value.length }}/1000
      </small>
    </label>

    <label class="client-form__checkbox client-form__full">
      <input type="checkbox" formControlName="active" />

      <span>Cliente ativo</span>
    </label>

    <div class="client-form__actions client-form__full">
      <button
        class="client-form__action"
        type="button"
        [disabled]="saving()"
        (click)="onCancel()"
      >
        Cancelar
      </button>

      <button
        class="client-form__save-button"
        type="submit"
        [disabled]="saving()"
      >
        {{ saving() ? 'Salvando...' : 'Salvar cliente' }}
      </button>
    </div>
  </form>
</section>
