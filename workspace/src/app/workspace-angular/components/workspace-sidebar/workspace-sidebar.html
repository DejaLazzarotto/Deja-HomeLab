<aside class="workspace-sidebar">

  <nav
    class="workspace-sidebar__navigation"
    aria-label="Navegação principal">

    @for (
      item of navigation;
      track item.id
    ) {

      <button
        class="workspace-sidebar__item"
        [class.workspace-sidebar__item--active]="isActive(item)"
        type="button"
        (click)="navigate(item)">

        <span
          class="workspace-sidebar__icon"
          aria-hidden="true">
          {{ item.icon }}
        </span>

        <span class="workspace-sidebar__title">
          {{ item.title }}
        </span>

      </button>

    }

  </nav>

</aside>
