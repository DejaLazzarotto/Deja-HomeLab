<aside class="workspace-sidebar">

  <nav
    #navigation
    class="workspace-sidebar__navigation"
    aria-label="Navegação principal"
    (scroll)="rememberScrollPosition()">

    @for (
      section of navigationSections;
      track section.id
    ) {

      <section class="workspace-sidebar__section">

        @if (section.title) {

          <h2 class="workspace-sidebar__section-title">
            {{ section.title }}
          </h2>

        }

        <div class="workspace-sidebar__section-items">

          @for (
            item of section.items;
            track item.id
          ) {

            <button
              class="workspace-sidebar__item"
              [class.workspace-sidebar__item--active]="isActive(item)"
              type="button"
              (click)="navigate(item)">

              <span
                class="workspace-sidebar__icon"
                aria-hidden="true">

                @if (resolveIcon(item); as icon) {

                  <img
                    class="workspace-sidebar__icon-image"
                    [src]="icon"
                    [alt]="item.title"
                  />

                }

              </span>

              <span class="workspace-sidebar__title">
                {{ item.title }}
              </span>

            </button>

          }

        </div>

      </section>

    }

  </nav>

</aside>
