<span
  class="workspace-status-indicator"
  [class.workspace-status-indicator--success]="status === 'success'"
  [class.workspace-status-indicator--warning]="status === 'warning'"
  [class.workspace-status-indicator--danger]="status === 'danger'"
  [class.workspace-status-indicator--info]="status === 'info'"
  [class.workspace-status-indicator--neutral]="status === 'neutral'"
  [class.workspace-status-indicator--sm]="size === 'sm'"
  [class.workspace-status-indicator--md]="size === 'md'"
  [class.workspace-status-indicator--lg]="size === 'lg'"
  [class.workspace-status-indicator--animated]="animated"
  aria-hidden="true">
</span>
