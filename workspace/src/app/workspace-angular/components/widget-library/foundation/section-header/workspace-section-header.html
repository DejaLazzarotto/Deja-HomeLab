<header class="workspace-section-header">

  <div class="workspace-section-header__content">

    @if (eyebrow) {
      <span class="workspace-section-header__eyebrow">
        {{ eyebrow }}
      </span>
    }

    <div class="workspace-section-header__heading">

      <h2 class="workspace-section-header__title">
        {{ title }}
      </h2>

      <div class="workspace-section-header__indicators">
        <ng-content select="[sectionHeaderIndicators]"></ng-content>
      </div>

      <div class="workspace-section-header__badges">
        <ng-content select="[sectionHeaderBadges]"></ng-content>
      </div>

    </div>

    @if (subtitle) {
      <span class="workspace-section-header__subtitle">
        {{ subtitle }}
      </span>
    }

    @if (description) {
      <p class="workspace-section-header__description">
        {{ description }}
      </p>
    }

  </div>

  <div class="workspace-section-header__actions">
    <ng-content select="[sectionHeaderActions]"></ng-content>
  </div>

</header>
