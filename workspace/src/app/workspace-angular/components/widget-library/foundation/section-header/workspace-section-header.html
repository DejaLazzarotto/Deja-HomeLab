<div class="workspace-section-header">

  <div class="workspace-section-header__content">

    @if (eyebrow) {
      <span class="workspace-section-header__eyebrow">
        {{ eyebrow }}
      </span>
    }

    <h2 class="workspace-section-header__title">
      {{ title }}
    </h2>

    @if (description) {
      <p class="workspace-section-header__description">
        {{ description }}
      </p>
    }

  </div>

  <div class="workspace-section-header__toolbar">
    <ng-content select="deja-workspace-toolbar"></ng-content>
  </div>

</div>
