<workspace-panel [interactive]="true" elevation="sm">

  <deja-workspace-surface panel-content variant="accent" padding="md" radius="md" elevation="none">

    <deja-section-header title="Workspace operacional"
      description="Infraestrutura institucional carregada corretamente.">

<deja-workspace-toolbar>

  <deja-button-group
    ariaLabel="Status do Workspace"
    size="md"
  >

    <deja-status-indicator
      status="success"
      size="md"
      [animated]="true"
    ></deja-status-indicator>

    <deja-status-badge
      label="Online"
      variant="success"
    ></deja-status-badge>

  </deja-button-group>

  <deja-toolbar-spacer></deja-toolbar-spacer>

  <deja-button-group
    ariaLabel="Ações do Workspace"
    size="md"
  >

    <deja-icon-button
      icon="⋯"
      label="Mais ações"
      variant="default"
      size="md"
      [disabled]="true"
    ></deja-icon-button>

  </deja-button-group>

</deja-workspace-toolbar>

    </deja-section-header>

  </deja-workspace-surface>


  <deja-workspace-stack panel-content gap="sm" align="start">

    <deja-section-header eyebrow="Deja Platform" title="Workspace pronto para operação"
      [description]="message"></deja-section-header>


    <deja-workspace-grid [columns]="4" gap="md">

      <deja-workspace-surface variant="card" padding="md" radius="md" elevation="none">

        <deja-kpi-card
          label="Runtime"
          value="Ativo"
          description="Workspace Runtime inicializado."
        ></deja-kpi-card>

      </deja-workspace-surface>


      <deja-workspace-surface variant="card" padding="md" radius="md" elevation="none">

        <deja-kpi-card
          label="Renderer"
          value="Angular"
          description="Renderer institucional registrado."
        ></deja-kpi-card>

      </deja-workspace-surface>


      <deja-workspace-surface variant="card" padding="md" radius="md" elevation="none">

        <deja-kpi-card
          label="Dashboard"
          value="Carregado"
          description="Composição inicial disponível."
        ></deja-kpi-card>

      </deja-workspace-surface>


      <deja-workspace-surface variant="card" padding="md" radius="md" elevation="none">

        <deja-kpi-card
          label="Foundation"
          value="Online"
          description="Componentes institucionais disponíveis."
        ></deja-kpi-card>

      </deja-workspace-surface>

    </deja-workspace-grid>


    <deja-workspace-grid [columns]="2" gap="md" align="stretch">

      <deja-workspace-surface variant="subtle" padding="lg" radius="md" elevation="none">

        <section class="workspace-welcome-widget__information">

          <deja-section-header eyebrow="Information" title="Ambiente preparado"
            description="A base visual e arquitetural da Deja Platform está preparada para receber novos componentes, gráficos, tabelas e módulos analíticos."></deja-section-header>


          <div class="workspace-welcome-widget__information-status">

            <deja-status-indicator status="success" size="sm"></deja-status-indicator>

            <span>
              Serviços principais disponíveis
            </span>

          </div>

        </section>

      </deja-workspace-surface>


      <deja-workspace-surface variant="subtle" padding="lg" radius="md" elevation="none">

        <section class="workspace-welcome-widget__quick-actions">

          <deja-section-header eyebrow="Quick Actions" title="Próximas capacidades"></deja-section-header>


          <div class="workspace-welcome-widget__action-list">

            <button class="workspace-welcome-widget__action" type="button" (click)="executeAction(analyticsActionId)">

              <span class="workspace-welcome-widget__action-copy">

                <strong>
                  Analytics
                </strong>

                <span>
                  Indicadores e visualizações
                </span>

              </span>

              <span class="workspace-welcome-widget__action-arrow" aria-hidden="true">
                →
              </span>

            </button>


            <button class="workspace-welcome-widget__action" type="button" (click)="executeAction(activityActionId)">

              <span class="workspace-welcome-widget__action-copy">

                <strong>
                  Activity
                </strong>

                <span>
                  Eventos e atividades recentes
                </span>

              </span>

              <span class="workspace-welcome-widget__action-arrow" aria-hidden="true">
                →
              </span>

            </button>


            <button class="workspace-welcome-widget__action" type="button" (click)="executeAction(timelineActionId)">

              <span class="workspace-welcome-widget__action-copy">

                <strong>
                  Timeline
                </strong>

                <span>
                  Marcos e evolução operacional
                </span>

              </span>

              <span class="workspace-welcome-widget__action-arrow" aria-hidden="true">
                →
              </span>

            </button>

          </div>

        </section>

      </deja-workspace-surface>

    </deja-workspace-grid>


    <deja-workspace-surface variant="subtle" padding="md" radius="sm" elevation="none">

      <div class="workspace-welcome-widget__footer">

        <span>
          Deja Platform
        </span>

        <span class="workspace-welcome-widget__footer-separator">
          •
        </span>

        <span>
          Workspace Foundation
        </span>

      </div>

    </deja-workspace-surface>

  </deja-workspace-stack>

</workspace-panel>
