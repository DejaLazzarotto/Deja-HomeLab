<workspace-panel
  [interactive]="true"
  elevation="sm"
>

  <deja-workspace-surface
    variant="accent"
    padding="md"
    radius="md"
    elevation="none"
  >

    <deja-section-header
      title="Workspace operacional"
      description="Infraestrutura institucional carregada corretamente."
    >

      <deja-status-indicator
        sectionHeaderIndicators
        status="success"
        size="md"
        [animated]="true"
      ></deja-status-indicator>

      <deja-status-badge
        sectionHeaderBadges
        label="Online"
        variant="success"
      ></deja-status-badge>

    </deja-section-header>

  </deja-workspace-surface>


  <deja-workspace-stack
    gap="sm"
    align="start"
  >

    <deja-section-header
      subtitle="Deja Platform"
      title="Workspace pronto para operação"
      [description]="message"
    ></deja-section-header>


    <deja-workspace-grid
      [columns]="4"
      gap="md"
    >

      <deja-workspace-surface
        variant="card"
        padding="md"
        radius="md"
        elevation="none"
      >

        <div class="workspace-welcome-widget__kpi">

          <span class="workspace-welcome-widget__kpi-label">
            Runtime
          </span>

          <strong class="workspace-welcome-widget__kpi-value">
            Ativo
          </strong>

          <span class="workspace-welcome-widget__kpi-description">
            Workspace Runtime inicializado.
          </span>

        </div>

      </deja-workspace-surface>


      <deja-workspace-surface
        variant="card"
        padding="md"
        radius="md"
        elevation="none"
      >

        <div class="workspace-welcome-widget__kpi">

          <span class="workspace-welcome-widget__kpi-label">
            Renderer
          </span>

          <strong class="workspace-welcome-widget__kpi-value">
            Angular
          </strong>

          <span class="workspace-welcome-widget__kpi-description">
            Renderer institucional registrado.
          </span>

        </div>

      </deja-workspace-surface>


      <deja-workspace-surface
        variant="card"
        padding="md"
        radius="md"
        elevation="none"
      >

        <div class="workspace-welcome-widget__kpi">

          <span class="workspace-welcome-widget__kpi-label">
            Dashboard
          </span>

          <strong class="workspace-welcome-widget__kpi-value">
            Carregado
          </strong>

          <span class="workspace-welcome-widget__kpi-description">
            Composição inicial disponível.
          </span>

        </div>

      </deja-workspace-surface>


      <deja-workspace-surface
        variant="card"
        padding="md"
        radius="md"
        elevation="none"
      >

        <div class="workspace-welcome-widget__kpi">

          <span class="workspace-welcome-widget__kpi-label">
            Foundation
          </span>

          <strong class="workspace-welcome-widget__kpi-value">
            Online
          </strong>

          <span class="workspace-welcome-widget__kpi-description">
            Componentes institucionais disponíveis.
          </span>

        </div>

      </deja-workspace-surface>

    </deja-workspace-grid>


    <deja-workspace-grid
      [columns]="2"
      gap="md"
      align="stretch"
    >

      <deja-workspace-surface
        variant="subtle"
        padding="lg"
        radius="md"
        elevation="none"
      >

        <section class="workspace-welcome-widget__information">

          <deja-section-header
            subtitle="Information"
            title="Ambiente preparado"
            description="A base visual e arquitetural da Deja Platform está preparada para receber novos componentes, gráficos, tabelas e módulos analíticos."
          ></deja-section-header>


          <div class="workspace-welcome-widget__information-status">

            <span
              class="workspace-welcome-widget__information-dot"
              aria-hidden="true"
            ></span>

            <span>
              Serviços principais disponíveis
            </span>

          </div>

        </section>

      </deja-workspace-surface>


      <deja-workspace-surface
        variant="subtle"
        padding="lg"
        radius="md"
        elevation="none"
      >

        <section class="workspace-welcome-widget__quick-actions">

          <deja-section-header
            subtitle="Quick Actions"
            title="Próximas capacidades"
          ></deja-section-header>


          <div class="workspace-welcome-widget__action-list">

            <button
              class="workspace-welcome-widget__action"
              type="button"
              disabled
            >

              <span class="workspace-welcome-widget__action-copy">

                <strong>
                  Analytics
                </strong>

                <span>
                  Indicadores e visualizações
                </span>

              </span>

              <span
                class="workspace-welcome-widget__action-arrow"
                aria-hidden="true"
              >
                →
              </span>

            </button>


            <button
              class="workspace-welcome-widget__action"
              type="button"
              disabled
            >

              <span class="workspace-welcome-widget__action-copy">

                <strong>
                  Activity
                </strong>

                <span>
                  Eventos e atividades recentes
                </span>

              </span>

              <span
                class="workspace-welcome-widget__action-arrow"
                aria-hidden="true"
              >
                →
              </span>

            </button>


            <button
              class="workspace-welcome-widget__action"
              type="button"
              disabled
            >

              <span class="workspace-welcome-widget__action-copy">

                <strong>
                  Timeline
                </strong>

                <span>
                  Marcos e evolução operacional
                </span>

              </span>

              <span
                class="workspace-welcome-widget__action-arrow"
                aria-hidden="true"
              >
                →
              </span>

            </button>

          </div>

        </section>

      </deja-workspace-surface>

    </deja-workspace-grid>


    <deja-workspace-surface
      variant="subtle"
      padding="md"
      radius="sm"
      elevation="none"
    >

      <div class="workspace-welcome-widget__footer">

        <span>
          Deja Platform
        </span>

        <span class="workspace-welcome-widget__footer-separator">
          •
        </span>

        <span>
          Workspace Foundation
        </span>

      </div>

    </deja-workspace-surface>

  </deja-workspace-stack>

</workspace-panel>
