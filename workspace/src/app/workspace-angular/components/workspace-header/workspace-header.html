<header class="workspace-header">

  <!-- =========================================================
       PRIMARY BAR
       Identidade institucional e contexto global da plataforma
       ========================================================= -->

  <div class="workspace-header__primary">

    <div class="workspace-header__brand">

      <img
        class="workspace-header__logo"
        src="/branding/icons/icon-64.png"
        alt="Deja Platform"
      />

      <div class="workspace-header__identity">

        <div class="workspace-header__platform">
          {{ platformName }}
        </div>

        <div class="workspace-header__application">
          {{ applicationName }}
        </div>

      </div>

    </div>

    <div class="workspace-header__global-actions">

      <!-- Área institucional reservada para:
           - Pesquisa global
           - Command Palette
           - Notificações
           - Aplicações
           - Organização / Tenant
           - Usuário -->

    </div>

  </div>


  <!-- =========================================================
       CONTEXT BAR
       Navegação e ações relacionadas ao contexto corrente
       ========================================================= -->

  <div class="workspace-header__context">

    <div class="workspace-header__context-left">

      <div class="workspace-header__workspace-label">
        Workspace
      </div>

    </div>

    <div class="workspace-header__context-actions">

      <!-- Área institucional reservada para:
           - Breadcrumb
           - Dashboard corrente
           - Filtros globais
           - Período
           - Atualização
           - Ações contextuais -->

    </div>

  </div>

</header>
