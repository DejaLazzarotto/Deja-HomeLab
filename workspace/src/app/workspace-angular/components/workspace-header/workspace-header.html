<header class="workspace-header">

  <div class="workspace-header__brand">

    <img
      class="workspace-header__logo"
      src="/branding/icons/icon-64.png"
      alt="Deja Platform"
    />

    <div class="workspace-header__titles">

      <div class="workspace-header__platform">
        {{ platformName }}
      </div>

      <div class="workspace-header__application">
        {{ applicationName }}
      </div>

    </div>

  </div>

  <div class="workspace-header__actions">

    <!-- Área reservada para:
         - Tenant
         - Organização
         - Usuário
         - Notificações
         - Command Palette
         - Ferramentas -->

  </div>

</header>
